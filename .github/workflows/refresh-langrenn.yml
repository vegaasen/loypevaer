name: Refresh langrenn events

on:
  schedule:
    # Run every Monday at 06:00 UTC (1 hour after cycling refresh)
    - cron: "0 6 * * 1"
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Fetch & commit langrenn events
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Fetch langrenn events
        run: bun run fetch-langrenn

      - name: Commit updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/langrenn-events.json
          if git diff --cached --quiet; then
            echo "No changes to langrenn events, skipping commit."
          else
            git commit -m "chore: refresh langrenn events [$(date -u +%Y-%m-%d)]"
            git push
          fi
